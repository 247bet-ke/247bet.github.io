    var tm = setInterval(function () { left--; var el = d.querySelector("#iw"); if (el) el.textContent = left; if (left <= 0) { clearInterval(tm); signOut(); } }, 1000);
    d.querySelector("#iwk").onclick = function () { clearInterval(tm); PL.warn = null; try { d.close(); } catch (e) {} d.remove(); PL.act = Date.now(); pulse().then(loop, loop); };
    d.querySelector("#iwo").onclick = function () { clearInterval(tm); signOut(); };
    d.addEventListener("cancel", function (ev) { ev.preventDefault(); });
  }
  document.addEventListener("click",function(e){if(e.target&&e.target.id==="plReset"){act({op:"resetLanes"}).then(function(){show("stats");});}});
})();
</script></body></html>
