<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>247Bet Admin</title>
<style>
:root{--bg:#020b20;--s:#08162d;--s2:#0e2240;--l:#15294a;--t:#eef4fb;--m:#8aa0bf;--g:#4ff32c;--r:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}
.w{max-width:1200px;margin:0 auto;padding:14px}h1{font-size:20px;margin:0 0 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
button,input,select{font:inherit;color:var(--t);background:var(--s2);border:1px solid var(--l);border-radius:8px;padding:8px 11px}
button{cursor:pointer}button.on,button.go{background:var(--g);color:#032008;border-color:var(--g);font-weight:700}
button.sm{padding:4px 8px;font-size:12px;margin:1px}button.bad{color:var(--r)}
.card{background:var(--s);border:1px solid var(--l);border-radius:12px;padding:12px;margin:10px 0}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.k div{background:var(--s);border:1px solid var(--l);border-radius:10px;padding:10px}
.k b{display:block;font-size:20px;color:var(--g)}.k span{color:var(--m);font-size:12px}
.tw{overflow-x:auto;border:1px solid var(--l);border-radius:10px}table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;border-bottom:1px solid var(--l);text-align:left;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}th{color:var(--m);font-weight:600;background:var(--s)}
.f{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.err{color:var(--r)}.m{color:var(--m)}
</style></head><body><div class="w">
<h1>247Bet Admin</h1>
<div id="login" class="card"><div class="f"><input id="u" size="48" placeholder="Apps Script /exec URL"><input id="k" type="password" placeholder="Admin key"><button class="go" id="in">Sign in</button></div><div id="le" class="err"></div></div>
<div id="app" hidden><div class="f"><input id="q" size="44" placeholder="Find a player: account no, phone, name or ID"><button class="go" id="qb">Search</button></div><nav id="nav"></nav><div id="out"></div></div>
</div>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var U = sessionStorage.getItem("u") || "", K = sessionStorage.getItem("k") || "";
  var TABS = [["stats", "Overview"], ["JpDesk", "Jackpot desk"], ["Activity", "Activity"], ["Withdrawals", "Withdrawals"], ["Resets", "Resets"], ["Chat", "Live chat"], ["Messages", "Messages"], ["Deposits", "Deposits"], ["Users", "Users"], ["Bets", "Bets"], ["Jackpots", "Jackpots"], ["JackpotEntries", "Entries"], ["Ledger", "Ledger"], ["Bonuses", "Bonuses"], ["Referrals", "Referrals"], ["Affiliates", "Affiliates"], ["AffPayouts", "Aff payouts"], ["Devices", "Devices"], ["tools", "Tools"]];
  function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function api(b) { b.key = K; return fetch(U, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(b) }).then(function (r) { return r.json(); }); }
  function act(o) { o.action = "admDo"; return api(o).then(function (r) { alert(r.ok ? (r.info || "Done.") : r.error); return r; }); }
  function legs(v) { try { return JSON.parse(v).map(function (g) { return g.home + " v " + g.away + ": " + g.l + "@" + g.p; }).join(" | "); } catch (e) { return v; } }
  function nav(cur) {
    $("#nav").innerHTML = TABS.map(function (t) { return '<button class="' + (t[0] === cur ? "on" : "") + '" data-t="' + t[0] + '">' + t[1] + "</button>"; }).join("");
  }
  function show(t) {
    nav(t); lastView = null; var o = $("#out"); o.innerHTML = '<p class="m">Loading...</p>';
    if (t === "stats") return api({ action: "admStats" }).then(function (r) {
      if (!r.ok) { o.innerHTML = '<p class="err">' + esc(r.error) + "</p>"; return; }
      var c = [["Users", r.users], ["Wallet balances", r.wallets], ["Open bets", r.openBets], ["Open stakes", r.openStake], ["Max payout owed", r.openLiability], ["Boost paid (all time)", "KES " + (r.boostPaid || 0) + " (" + (r.boostWins || 0) + " bets)"], ["Boost paid, last 7 days", "KES " + (r.boostWeek || 0)], ["Boost on open bets", "KES " + (r.boostOpen || 0)], ["Pending withdrawals", r.pendingWithdrawals + " (KES " + r.pendingWithdrawalSum + ")"], ["Pending deposits", r.pendingDeposits], ["Locked bonuses", r.activeBonusCount + " (KES " + r.activeBonus + ")"], ["Pending referrals", r.pendingReferrals], ["Matches live", r.odds], ["Payments", r.paymentsOn ? "Connected" : "Not set up"]];
      var pend = Number(r.pendingWithdrawals) + 0, rp = Number(r.pendingResets) || 0, pdr = Number(r.pendingDrafts) || 0;
      o.innerHTML = (pdr > 0 ? '<div class="card" style="border-color:#4ff32c"><b>' + pdr + ' jackpot draft' + (pdr > 1 ? 's' : '') + ' waiting for your approval</b> <button class="sm go" data-t="JpDesk">Open Jackpot desk</button></div>' : "") + (rp > 0 ? '<div class="card" style="border-color:#ffc247"><b>' + rp + ' password reset request' + (rp > 1 ? 's' : '') + ' waiting</b> <button class="sm go" data-t="Resets">Open resets</button></div>' : "") + (pend > 0 ? '<div class="card" style="border-color:#ffc247"><b>' + pend + ' withdrawal request' + (pend > 1 ? 's' : '') + ' waiting (KES ' + esc(r.pendingWithdrawalSum) + ')</b> <button class="sm go" data-t="Withdrawals">Open requests</button></div>' : "") + '<div class="k">' + c.map(function (x) { return "<div><b>" + esc(x[1]) + "</b><span>" + x[0] + "</span></div>"; }).join("") + '</div><div class="card"><b>Ledger totals</b><br>' + Object.keys(r.byType).map(function (k) { return esc(k) + ": " + esc(Math.round(r.byType[k] * 100) / 100); }).join(" &middot; ") + "</div>";
    });
    if (t === "tools") return tools(o);
    if (t === "JpDesk") return jpDesk(o);
    api({ action: "admList", sheet: t }).then(function (r) {
      if (!r.ok) { o.innerHTML = '<p class="err">' + esc(r.error) + "</p>"; return; }
      if (t === "Withdrawals" || t === "AffPayouts") { var si = t === "Withdrawals" ? 4 : 5; r.rows = r.rows.filter(function (x) { return x[si] !== "paid" && x[si] !== "rejected"; }).concat(r.rows.filter(function (x) { return x[si] === "paid" || x[si] === "rejected"; })); }
      var h = r.headers, hasAct = ["Users", "Chat", "Resets", "Bets", "Withdrawals", "Deposits", "Bonuses", "Devices", "Affiliates", "AffPayouts"].indexOf(t) > -1;
      o.innerHTML = '<p class="m">' + (t === "Withdrawals" ? "Open requests first. Send the NET amount (column net) on M-Pesa, then press Sent / Paid; use In process and Verified to update the player\'s status. Reject refunds the player. Large requests are split into parts (ids end -1, -2, ...) of at most KES 250,000 each: pay each part separately. A note saying High payout means the request is above KES 500,000: pay the parts one after another, or arrange a bank transfer with the player." : t === "Resets" ? "Players who tapped Forgot password. Press Reset password, then send them the temporary password (WhatsApp or call)." : t === "Activity" ? "Every sign-up, deposit and withdrawal, newest first." : "Newest 200 rows") + '</p><div class="tw"><table><tr>' + h.map(function (x) { return "<th>" + esc(x) + "</th>"; }).join("") + (hasAct ? "<th>Actions</th>" : "") + "</tr>" +
        r.rows.map(function (row) {
          var tds = row.map(function (v, i) { return '<td title="' + esc(h[i] === "legs" ? legs(v) : v) + '">' + esc(h[i] === "legs" ? legs(v) : v) + "</td>"; }).join(""), a = "", id = esc(row[0]);
          if (t === "Bets" && row[7] === "open") a = ["won", "lost", "void"].map(function (x) { return '<button class="sm" data-do="settleBet" data-id="' + id + '" data-r="' + x + '">' + x + "</button>"; }).join("");
          if (t === "Chat" && row[3] === "user") a = '<button class="sm go" data-do="chatReply" data-id="' + esc(row[1]) + '">Reply</button>';
          if (t === "Withdrawals" && row[4] !== "paid" && row[4] !== "rejected") a = '<button class="sm" data-do="wdProcess" data-id="' + id + '">In process</button><button class="sm" data-do="wdVerify" data-id="' + id + '">Verified</button><button class="sm go" data-do="wdPaid" data-id="' + id + '">Sent / Paid</button><button class="sm bad" data-do="wdReject" data-id="' + id + '">Reject</button>';
          if (t === "Deposits" && row[4] === "pending") a = '<button class="sm" data-do="recheckDeposit" data-id="' + id + '">Re-check</button>';
          if (t === "Bonuses" && row[7] === "active") a = '<button class="sm" data-do="bonusRelease" data-id="' + id + '">Release</button><button class="sm bad" data-do="bonusCancel" data-id="' + id + '">Cancel</button>';
          if (t === "Affiliates") a = (row[3] === "pending" || row[3] === "suspended" ? '<button class="sm" data-do="affSet" data-id="' + id + '" data-r="approved">Approve</button>' : "") + (row[3] === "approved" ? '<button class="sm bad" data-do="affSet" data-id="' + id + '" data-r="suspended">Suspend</button>' : "") + (row[3] === "pending" ? '<button class="sm bad" data-do="affSet" data-id="' + id + '" data-r="rejected">Reject</button>' : "");
          if (t === "AffPayouts" && row[5] === "pending") a = '<button class="sm" data-do="affPaid" data-id="' + id + '">Paid</button><button class="sm bad" data-do="affReject" data-id="' + id + '">Reject</button>';
          if (t === "Devices") a = '<button class="sm bad" data-do="devRemove" data-id="' + id + '" data-r="' + esc(row[1]) + '">Remove</button>';
          if (t === "Resets" && row[4] === "pending") a = '<button class="sm" data-do="resetPw" data-id="' + esc(row[1]) + '">Reset password</button>';
          if (t === "Users") a = '<button class="sm go" data-open="' + id + '">Open</button><button class="sm bad" data-do="resetPw" data-id="' + id + '">Reset pw</button>' + '<button class="sm" data-do="userStatus" data-id="' + id + '" data-r="' + (row[5] === "active" ? "suspended" : "active") + '">' + (row[5] === "active" ? "Suspend" : "Activate") + "</button>";
          return "<tr>" + tds + (hasAct ? "<td>" + a + "</td>" : "") + "</tr>";
        }).join("") + "</table></div>";
    });
  }
  var lastView = null;
  function th(x) { return "<th>" + esc(x) + "</th>"; }
  function cell(h, v) { var s = h === "legs" ? legs(v) : v; return '<td title="' + esc(s) + '">' + esc(s) + "</td>"; }
  function bigTable(h, rows, extra) { return '<div class="tw"><table><tr>' + h.map(th).join("") + (extra ? "<th>Actions</th>" : "") + "</tr>" + rows.map(function (r) { return "<tr>" + r.map(function (v, i) { return cell(h[i], v); }).join("") + (extra ? "<td>" + extra(r) + "</td>" : "") + "</tr>"; }).join("") + "</table></div>"; }
  function pBtns(r) {
    var id = esc(r[0]), on = r[5] === "active";
    return '<button class="sm go" data-open="' + id + '">Open</button><button class="sm" data-msg="' + id + '">Message</button><button class="sm bad" data-do="resetPw" data-id="' + id + '">Reset pw</button><button class="sm" data-do="userStatus" data-id="' + id + '" data-r="' + (on ? "suspended" : "active") + '">' + (on ? "Suspend" : "Activate") + "</button>";
  }
  function search(q) {
    nav(""); lastView = function () { search(q); }; var o = $("#out"); o.innerHTML = '<p class="m">Searching...</p>';
    api({ action: "admFind", q: q }).then(function (r) {
      if (!r.ok) { o.innerHTML = '<p class="err">' + esc(r.error) + "</p>"; return; }
      o.innerHTML = r.rows.length ? '<p class="m">' + r.rows.length + " player(s) found.</p>" + bigTable(r.headers, r.rows, pBtns) : '<p class="m">No player found for "' + esc(q) + '".</p>';
    });
  }
  function openPlayer(id) {
    nav(""); lastView = function () { openPlayer(id); }; var o = $("#out"); o.innerHTML = '<p class="m">Loading...</p>';
    api({ action: "admPlayer", id: id }).then(function (r) {
      if (!r.ok) { o.innerHTML = '<p class="err">' + esc(r.error) + "</p>"; return; }
      var u = r.row, h = r.headers;
      o.innerHTML = '<div class="card"><b>' + esc(u[3]) + '</b> &middot; Account no <b>' + esc(u[1]) + "</b> &middot; " + esc(u[2]) + " &middot; " + esc(u[5]) + " &middot; Balance KES " + esc(u[7]) + '<div class="f">' + pBtns(u).replace('<button class="sm go" data-open="' + esc(u[0]) + '">Open</button>', "") + "</div>" +
        '<span class="m">ID ' + esc(u[0]) + " &middot; joined " + esc(u[4]) + " &middot; currency " + esc(u[6]) + "</span></div>" +
        r.sections.map(function (s) { return '<div class="card"><b>' + esc(s.name) + '</b> <span class="m">(latest ' + s.rows.length + ")</span>" + (s.rows.length ? bigTable(s.headers, s.rows) : '<p class="m">Nothing yet.</p>') + "</div>"; }).join("");
    });
  }
  /* ---------- Jackpot desk: the picker's drafts, approve or edit then approve ---------- */
  var JD = {};
  function jdWhen(t) { return new Date(t).toLocaleString("en-KE", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
  function jdOpt(c) { return '<option value="' + esc(c.mid) + '">' + esc(jdWhen(c.t) + " | " + c.league + " | " + c.home + " v " + c.away + " | " + c.h + "/" + c.d + "/" + c.a + " | " + c.score + (c.strict ? "" : " (relaxed)")) + "</option>"; }
  function jdCard(id) {
    var s = JD[id], T = s.T, n = s.picks.length, first = n ? Math.min.apply(null, s.picks.map(function (m) { return m.t; })) : 0, used = {};
    s.picks.forEach(function (m) { used[m.mid] = 1; });
    var opts = s.cands.filter(function (c) { return !used[c.mid]; }).map(jdOpt).join("");
    var rows = s.picks.map(function (m, i) {
      return "<tr><td>" + (i + 1) + "</td><td>" + esc(jdWhen(m.t)) + "</td><td>" + esc(m.league) + "</td><td>" + esc(m.home + " v " + m.away) + "</td><td>" + m.h + "</td><td>" + m.d + "</td><td>" + m.a + "</td><td>" + m.score + "</td><td>" + (m.strict ? "Even" : '<span class="err">Relaxed</span>') + "</td><td>" +
        '<select data-jd="swap" data-id="' + esc(id) + '" data-i="' + i + '"><option value="">Swap for...</option>' + opts + '</select><button class="sm bad" data-jd="rm" data-id="' + esc(id) + '" data-i="' + i + '">Remove</button></td></tr>';
    }).join("");
    var tiers = T.tiers.map(function (p, k) { return (T.size - k) + " correct " + p + "%"; }).join(" &middot; ");
    return '<div class="card" id="jd_' + esc(id) + '"><b>' + esc(T.name) + "</b> &middot; Entry KES " + T.fee + " &middot; Win up to KES " + Number(T.headline).toLocaleString("en-KE") + ' <span class="m">&middot; ' + n + " of " + T.size + " matches &middot; closes " + (first ? esc(jdWhen(first)) : "-") + "</span>" +
      '<p class="m">Prize shares of the pool: ' + tiers + ". Draft " + esc(id) + " made " + esc(jdWhen(s.d.created)) + ".</p>" + (s.d.note ? '<p class="err">' + esc(s.d.note) + "</p>" : "") +
      '<div class="tw"><table><tr><th>#</th><th>Kickoff</th><th>League</th><th>Match</th><th>1</th><th>X</th><th>2</th><th>Balance</th><th>Status</th><th>Edit</th></tr>' + rows + "</table></div>" +
      (n < T.size ? '<div class="f"><select data-jd="add" data-id="' + esc(id) + '"><option value="">Add a match (' + (T.size - n) + ' more needed)...</option>' + opts + "</select></div>" : "") +
      '<div class="f"><input id="jdSeed_' + esc(id) + '" type="number" min="0" placeholder="Seed KES (optional)" value="' + (s.seed || "") + '"><button data-jd="save" data-id="' + esc(id) + '">Save edit</button><button class="go" data-jd="approve" data-id="' + esc(id) + '">Approve &amp; post</button><button class="bad" data-jd="reject" data-id="' + esc(id) + '">Reject</button></div></div>';
  }
  function jpDesk(o) {
    api({ action: "admDo", op: "jpDrafts" }).then(function (r) {
      if (!r.ok) { o.innerHTML = '<p class="err">' + esc(r.error) + "</p>"; return; }
      JD = {};
      r.drafts.forEach(function (d) { JD[d.id] = { d: d, picks: d.matches.slice(), cands: d.cands.slice(), seed: d.seed, T: r.types[d.type] }; });
      o.innerHTML = '<div class="card"><b>Jackpot desk</b><p class="m">The picker drafts evenly matched games: Midweek (Tue + Wed kickoffs) every Sunday, Weekend (Sat + Sun kickoffs) every Wednesday. Nothing goes live until you press Approve &amp; post. Balance 0 = perfectly even (like 2.9 / 2.9 / 2.9); lower is more even. Seed adds your own money to the prize pool.</p>' +
        '<div class="f"><button data-jd="new" data-ty="MID">Draft Midweek now</button><button data-jd="new" data-ty="WKD">Draft Weekend now</button></div></div>' +
        (r.drafts.length ? r.drafts.map(function (d) { return jdCard(d.id); }).join("") : '<p class="m">No drafts waiting.</p>');
    });
  }
  function jdRedraw(id) { var el = document.getElementById("jd_" + id); if (el) el.outerHTML = jdCard(id); }
  function jdSend(op, id) {
    var s = JD[id], seed = document.getElementById("jdSeed_" + id); s.seed = seed ? seed.value : s.seed;
    return act({ op: op, id: id, ids: s.picks.map(function (m) { return m.mid; }), seed: s.seed });
  }
  function jdClick(b) {
    var d = b.dataset, id = d.id, s = JD[id];
    if (d.jd === "new") { if (!confirm("Make a fresh draft? Any waiting draft of this jackpot is replaced.")) return; act({ op: "jpDraftNow", type: d.ty }).then(function () { show("JpDesk"); }); return; }
    if (!s) return;
    if (d.jd === "rm") { s.picks.splice(Number(d.i), 1); jdRedraw(id); return; }
    if (d.jd === "save") { jdSend("jpDraftSave", id).then(function (r) { if (r && r.ok) show("JpDesk"); }); return; }
    if (d.jd === "reject") { if (confirm("Reject this draft?")) act({ op: "jpDraftReject", id: id }).then(function () { show("JpDesk"); }); return; }
    if (d.jd === "approve") {
      if (s.picks.length !== s.T.size) { alert("You need exactly " + s.T.size + " matches (you have " + s.picks.length + ")."); return; }
      if (!confirm("Post " + s.T.name + " now? Players can enter immediately and it closes at the first kickoff.")) return;
      jdSend("jpDraftApprove", id).then(function (r) { if (r && r.ok) show("JpDesk"); });
    }
  }
  function jdChange(sel) {
    var d = sel.dataset, s = JD[d.id]; if (!s || !sel.value) return;
    var c = s.cands.filter(function (x) { return x.mid === sel.value; })[0]; if (!c) return;
    if (d.jd === "swap") { var old = s.picks[Number(d.i)]; s.picks[Number(d.i)] = c; s.cands = s.cands.filter(function (x) { return x.mid !== c.mid; }); if (old) s.cands.push(old); }
    else if (d.jd === "add") { s.picks.push(c); s.cands = s.cands.filter(function (x) { return x.mid !== c.mid; }); }
    s.picks.sort(function (x, y) { return x.t - y.t; });
    var seed = document.getElementById("jdSeed_" + d.id); if (seed) s.seed = seed.value;
    jdRedraw(d.id);
  }
  document.addEventListener("change", function (e) { if (e.target.dataset && (e.target.dataset.jd === "swap" || e.target.dataset.jd === "add")) jdChange(e.target); });
  function tools(o) {
    o.innerHTML = '<div class="card"><b>Odds</b><div class="f"><button id="ro">Refresh odds now</button><button id="tp">Test Paynecta connection</button></div></div>' +
      '<div class="card"><b>Send a message</b> <span class="m">(shows in the player\'s Inbox; leave "To" empty to message everyone)</span><div class="f"><input id="mT" placeholder="To: account no, phone or ID"><input id="mH" placeholder="Title"><input id="mB" size="40" placeholder="Message"><button id="mS" class="go">Send</button></div></div>' +
      '<div class="card"><b>Adjust a wallet</b> <span class="m">(refunds, corrections; always logged)</span><div class="f"><input id="aU" placeholder="User ID (U...)"><input id="aA" type="number" placeholder="Amount (+/-)"><input id="aN" placeholder="Reason"><button id="ab">Apply</button></div></div>' +
      '<div class="card"><b>Create jackpot</b><div class="f"><select id="jT"><option value="MID">Midweek 10</option><option value="WKD">Weekend 14</option></select><input id="jS" type="number" placeholder="Seed KES (optional)"><button id="jL">Load matches</button><button id="jC" class="go">Create</button></div><div id="jM" style="max-height:260px;overflow:auto"></div></div>' +
      '<div class="card"><b>Settle jackpot</b><div class="f"><input id="sI" placeholder="Jackpot ID (J...)"><input id="sR" size="40" placeholder="Results e.g. 1,X,2,1,... (V = void)"><button id="sB" class="go">Settle</button></div></div>';
    $("#ro").onclick = function () { act({ op: "refreshOdds" }); };
    $("#tp").onclick = function () { act({ op: "testPay" }); };
    $("#mS").onclick = function () { if (!$("#mT").value.trim() && !confirm("Send this to EVERY player?")) return; act({ op: "sendMsg", to: $("#mT").value, title: $("#mH").value, text: $("#mB").value }).then(function (r) { if (r && r.ok) { $("#mH").value = ""; $("#mB").value = ""; } }); };
    $("#ab").onclick = function () { act({ op: "adjust", id: $("#aU").value.trim(), amount: $("#aA").value, note: $("#aN").value }); };
    $("#sB").onclick = function () {
      var id = $("#sI").value.trim(), res = $("#sR").value.split(",").map(function (x) { return x.trim().toUpperCase(); });
      api({ action: "admDo", op: "previewJp", id: id, results: res }).then(function (r) {
        if (!r.ok) { alert(r.error); return; }
        var p = r.preview, lines = p.tiers.map(function (t) { return t.correct + " correct: " + t.winners + " winner(s)" + (t.winners ? ", KES " + t.each + " each" : ", rolls over KES " + t.share); });
        var typed = prompt(p.name + "\nEntries: " + p.entries + "\nPool: KES " + p.pool + "\nVoid matches: " + p.voids + "\n" + lines.join("\n") + "\nTotal paid out: KES " + p.paid + "\nRolls over: KES " + p.carry + "\n\nThis cannot be undone. Type " + id + " to confirm.");
        if (typed !== id) { alert("Cancelled. Nothing was paid."); return; }
        act({ op: "settleJp", id: id, results: res });
      });
    };
    $("#jL").onclick = function () { api({ action: "admDo", op: "upcoming" }).then(function (r) { $("#jM").innerHTML = r.ok ? r.matches.map(function (m) { return '<label style="display:block;padding:3px 0"><input type="checkbox" value="' + esc(m.id) + '"> ' + esc(new Date(m.t).toLocaleString("en-KE", { dateStyle: "short", timeStyle: "short" }) + " | " + m.league + " | " + m.home + " v " + m.away) + "</label>"; }).join("") : esc(r.error); }); };
    $("#jC").onclick = function () { var ids = Array.prototype.map.call(document.querySelectorAll("#jM input:checked"), function (x) { return x.value; }); act({ op: "createJp", type: $("#jT").value, ids: ids, seed: $("#jS").value }); };
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.jd) return jdClick(b);
    if (b.dataset.t) return show(b.dataset.t);
    if (b.dataset.open) return openPlayer(b.dataset.open);
    if (b.dataset.msg) { var mt = prompt("Title"); if (!mt) return; var mb = prompt("Message to the player"); if (!mb) return; act({ op: "sendMsg", to: b.dataset.msg, title: mt, text: mb }); return; }
    if (b.dataset["do"]) {
      var d = b.dataset, o = { op: d["do"], id: d.id, result: d.r, status: d.r };
      if (d["do"] === "chatReply") { o.text = prompt("Reply to player"); if (!o.text) return; act(o).then(function () { show("Chat"); }); return; }
      if (d["do"] === "wdReject") o.note = prompt("Reason (optional)") || "";
      if (d["do"] === "affSet" && d.r === "approved") { o.rate = prompt("Terms: revenue share %, CPA in KES (e.g. 30,0 or 25,100 or 0,150)", "30,0"); if (o.rate === null) return; }
      if (!confirm("Confirm: " + d["do"] + " " + d.id + (d.r ? " -> " + d.r : "") + "?")) return;
      act(o).then(function () { if (lastView) return lastView(); var cur = document.querySelector("#nav .on"); show(cur ? cur.dataset.t : "stats"); });
    }
  });
  $("#qb").onclick = function () { var q = $("#q").value.trim(); if (q) search(q); };
  $("#q").onkeydown = function (e) { if (e.key === "Enter") $("#qb").onclick(); };
  $("#u").value = U || "https://script.google.com/macros/s/AKfycbwdELw9L8ENkynwEhCnM0xvaiY1nha1sjAgznudoVEJWacdddMXBlsqlIAD50dzEFRciQ/exec";
  function enter() { $("#login").hidden = true; $("#app").hidden = false; show("stats"); }
  $("#in").onclick = function () {
    U = $("#u").value.trim(); K = $("#k").value; $("#le").textContent = "";
    api({ action: "admStats" }).then(function (r) {
      if (!r.ok) { $("#le").textContent = r.error || "Could not sign in."; return; }
      sessionStorage.setItem("u", U); sessionStorage.setItem("k", K); enter();
    }).catch(function () { $("#le").textContent = "Could not reach the server. Check the URL."; });
  };
  if (U && K) api({ action: "admStats" }).then(function (r) { if (r.ok) enter(); });
})();
